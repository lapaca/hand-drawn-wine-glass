<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极速手绘红酒杯 - GPU级物理加速</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f7f3e9; /* 仿粗糙纸张质感 */
    overflow: hidden;
  }

  .glass-container {
    position: relative;
    width: 250px;
    height: 400px;
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* 核心物理惯性缓冲 - 100倍性能加速的关键 */
  #liquid-group {
    transform-origin: 125px 150px; /* 物理重心 */
    transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    will-change: transform;
  }

  /* 纯 GPU 渲染的无缝液面波浪 */
  .wave {
    animation: swirl 2.5s linear infinite;
    will-change: transform;
  }
  .wave-back {
    animation: swirl-back 3.5s linear infinite;
    will-change: transform;
  }

  @keyframes swirl {
    0% { transform: translateX(0); }
    100% { transform: translateX(-150px); }
  }
  @keyframes swirl-back {
    0% { transform: translateX(-150px); }
    100% { transform: translateX(0); }
  }
</style>
</head>
<body>

<div class="glass-container">
  <svg viewBox="0 0 250 400">
    <defs>
      <!-- 动态铅笔手绘粗糙线条滤镜 -->
      <filter id="pencil-texture" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>

      <!-- 高效矢量遮罩 -->
      <clipPath id="glass-mask">
        <path d="M 61,60 C 51,180 81,240 125,240 C 169,240 199,180 189,60 Z" />
      </clipPath>

      <linearGradient id="wine-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#cc0033" />
        <stop offset="100%" stop-color="#4a000d" />
      </linearGradient>
    </defs>

    <!-- 酒液摇摆物理层 -->
    <g clip-path="url(#glass-mask)">
      <g id="liquid-group">
        <!-- 景深背景暗浪 -->
        <path class="wave-back" d="M 0,130 Q 37.5,150 75,130 T 150,130 T 225,130 T 300,130 T 375,130 T 450,130 L 450,300 L 0,300 Z" fill="#7a001d" opacity="0.8"/>
        <!-- 前景亮浪 -->
        <path class="wave" d="M 0,140 Q 37.5,120 75,140 T 150,140 T 225,140 T 300,140 T 375,140 T 450,140 L 450,300 L 0,300 Z" fill="url(#wine-grad)"/>
      </g>
    </g>

    <!-- 手绘风格杯体轮廓 -->
    <g fill="none" stroke="#2c2c2c" stroke-width="2.5" stroke-linecap="round" filter="url(#pencil-texture)">
      <!-- 杯口 -->
      <ellipse cx="125" cy="55" rx="66" ry="8" stroke-width="1.5"/>
      <!-- 杯身 -->
      <path d="M 59,55 C 45,180 80,245 125,245 C 170,245 205,180 191,55" />
      <!-- 杯柄 -->
      <path d="M 125,245 C 122,290 128,340 125,350" stroke-width="3.5"/>
      <!-- 底座 -->
      <path d="M 90,350 C 100,345 150,345 160,350" stroke-width="2.5"/>
    </g>
    
    <!-- 动态微高光，增添玻璃通透感 -->
    <path d="M 70,100 C 65,140 75,180 90,210" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.6" filter="url(#pencil-texture)" />
  </svg>
</div>

<script>
  const liquid = document.getElementById('liquid-group');
  
  // 贝塞尔重力惯性算法
  const updateLiquidPhysics = (x, y, width, height) => {
    const normX = (x / width - 0.5) * 2; 
    const normY = (y / height - 0.5) * 2;
    
    const rotate = normX * 20; 
    const translateY = normY * 10;
    
    liquid.style.transform = `translateY(${translateY}px) rotate(${rotate}deg)`;
  };

  // 鼠标追踪
  document.addEventListener('mousemove', (e) => {
    updateLiquidPhysics(e.clientX, e.clientY, window.innerWidth, window.innerHeight);
  });

  // 移动端重力感应支持
  window.addEventListener('deviceorientation', (e) => {
    if (e.gamma === null) return;
    const x = Math.min(Math.max(e.gamma, -45), 45) + 45; 
    const y = Math.min(Math.max(e.beta, -45), 45) + 45;
    updateLiquidPhysics(x, y, 90, 90);
  });

  // 复位回弹
  document.addEventListener('mouseleave', () => {
    liquid.style.transform = `translateY(0px) rotate(0deg)`;
  });
</script>
</body>
</html>
